name: Import Yusuke movement PNGs
on:
  push:
    paths:
      - '.github/workflows/import-yusuke-movement-v17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sprites:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing game
        uses: actions/checkout@v4
      - name: Download supplied sprites with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p characters/yusuke /tmp/yusuke-art-import
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3FsehSSM8aaRaK5HcNwjYb3e6/51dc070c-9a13-44bd-a408-e79674ddf323.png' \
            -o characters/yusuke/yusuke_walk_backward_turn_12frames.png
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://at.adobe.com/3VCIMDMbbj0MOFxP' \
            -o characters/yusuke/yusuke_run_dash_12frames.png
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3FsehSSM8aaRaK5HcNwjYb3e6/b9cbc7f4-a928-4f52-af80-176d548b7fb2.zip' \
            -o /tmp/yusuke-art-import/idle-walk-pack.zip
          unzip -p /tmp/yusuke-art-import/idle-walk-pack.zip idle_12frames.png > characters/yusuke/yusuke_idle_12frames.png
          unzip -p /tmp/yusuke-art-import/idle-walk-pack.zip walk_forward_12frames.png > characters/yusuke/yusuke_walk_forward_12frames.png
          cat > /tmp/yusuke-art-import/checksums.txt <<'CHECKSUMS'
          081b2c8f3e9b58e4288c8399ab37871b9a0f0b7152e3df920f45d1e62ad88873  characters/yusuke/yusuke_walk_backward_turn_12frames.png
          21b754b0b702705e31e2ccf7a2cfdd00c62db9f69bf1a68ede5ff29f0563ae90  characters/yusuke/yusuke_run_dash_12frames.png
          ad1553fe2fc5e8945eb03407b4bf69fa9031115ead7d5746de9892b89225c25c  characters/yusuke/yusuke_idle_12frames.png
          4374c2378a9a0ee745dbf7e07fff9ad22708908cffce11ee6306ab5207cb0098  characters/yusuke/yusuke_walk_forward_12frames.png
          CHECKSUMS
          sha256sum -c /tmp/yusuke-art-import/checksums.txt
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for name in ['yusuke_walk_backward_turn_12frames.png','yusuke_run_dash_12frames.png',
                       'yusuke_idle_12frames.png','yusuke_walk_forward_12frames.png']:
              b = (Path('characters/yusuke') / name).read_bytes()
              assert b[:8] == b'\x89PNG\r\n\x1a\n', name
              assert struct.unpack('>II',b[16:24]) == (1536,512), name
              assert b[25] == 6, f'{name}: image must be RGBA'
              print(f'{name}: verified 1536x512 RGBA ({len(b)} bytes)')
          PY
      - name: Commit the four original transparent PNG atlases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters/yusuke/yusuke_walk_backward_turn_12frames.png \
            characters/yusuke/yusuke_run_dash_12frames.png \
            characters/yusuke/yusuke_idle_12frames.png \
            characters/yusuke/yusuke_walk_forward_12frames.png
          if ! git diff --cached --quiet; then
            git commit -m "Add four original transparent Yusuke movement atlases"
            git push origin HEAD:main
          fi
