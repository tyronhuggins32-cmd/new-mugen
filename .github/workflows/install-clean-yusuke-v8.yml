name: Install cleaned Yusuke V8 sprite art
on:
  push:
    paths:
      - ".github/workflows/install-clean-yusuke-v8.yml"
permissions:
  contents: write
jobs:
  clean-premium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PNG clean-up libraries
        run: python3 -m pip install --quiet pillow numpy scipy
      - name: Prove white fringe and interior hole cleanup
        run: PYTHONPATH=. python3 tests/sprite-edge-v8.py
      - name: Rebuild both V8 transparent atlases
        run: python3 tools/repair_yusuke_alpha_v8.py
      - name: Check cleaned art, production metadata and built game fallback
        run: |
          node tests/premium-v6.cjs
          node tests/yusuke-sprites.cjs
          node tests/air-and-vfx-v8.cjs
      - name: Inspect alpha transparency in final texture files
        run: |
          python3 - <<'PY'
          import json
          from PIL import Image
          d=json.load(open("characters/yusuke/premium-atlas.json"))
          assert d["version"]==4
          for name in ("combat","movement"):
            image=Image.open(d[name]["src"]).convert("RGBA")
            assert image.getpixel((0,0))[3]==0
            assert image.getchannel("A").getextrema()==(0,255)
            print("Verified alpha, frame pivots and V8 reference:",name,image.size)
          PY
      - name: Commit cleaned production assets atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters/yusuke/yusuke-premium-*-v8.png characters/yusuke/premium-atlas.json
          if ! git diff --cached --quiet; then
            git commit -m "Fix Yusuke white sprite gaps and outline halos in both premium atlases"
            git pull --rebase origin main
            git push
          fi
