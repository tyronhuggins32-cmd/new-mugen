name: Import Yusuke crouch sprite atlas V18
on:
  push:
    paths: ['.github/workflows/import-yusuke-crouch-v18.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-crouch-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify authored RGBA PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p characters/yusuke
          curl --fail --location --silent --show-error --retry 3 --max-time 90             'https://at.adobe.com/0ns7g0e6U6pLM0XC'             -o characters/yusuke/yusuke_crouch_crouchwalk_10frames.png
          echo '8bef4cccc0dc3c0115002d4f62aea646e2270614dfa2ac6651d19f87911329ec  characters/yusuke/yusuke_crouch_crouchwalk_10frames.png' | sha256sum -c -
          python3 - <<'PY'
          import struct
          p='characters/yusuke/yusuke_crouch_crouchwalk_10frames.png'
          b=open(p,'rb').read()
          assert b[:8] == bytes.fromhex('89504e470d0a1a0a'), 'Not a PNG'
          assert struct.unpack('>II',b[16:24]) == (1280,512), 'Must be 5x2 cells of 256'
          assert b[25] == 6, 'Must contain RGBA alpha'
          print('PASS 10 crouch/crouchwalk RGBA cels, 1280x512, verified SHA256')
          PY
      - name: Commit original PNG atlas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters/yusuke/yusuke_crouch_crouchwalk_10frames.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add original transparent Yusuke crouch and crouch-walk art V18'
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              echo "Concurrent repository update; retry $attempt"
              sleep 2
            done
            exit 1
          fi
