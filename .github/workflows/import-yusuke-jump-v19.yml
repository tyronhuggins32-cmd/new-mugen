name: Import Yusuke Jump Landing V19
on:
  push:
    paths:
      - '.github/workflows/import-yusuke-jump-v19.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified source atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p characters/yusuke
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://at.adobe.com/hjzzCIt7l1Q0wl8Z' \
            -o characters/yusuke/yusuke_jump_landing_14frames.png
          echo 'c71e0a66cb8bca7434fa9482bf33371d281bf1004f148b727bb8cc4aac6c8842  characters/yusuke/yusuke_jump_landing_14frames.png' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('characters/yusuke/yusuke_jump_landing_14frames.png')
          b=p.read_bytes()
          assert b[:8]==bytes.fromhex('89504e470d0a1a0a'), 'bad png'
          assert struct.unpack('>II',b[16:24]) == (1024,1024), '4x4x256 atlas required'
          assert b[25] == 6, 'true RGBA alpha required'
          print('PASS: 14 authored jump/landing frames, transparent 1024x1024 RGBA')
          PY
      - name: Commit original transparent PNG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add characters/yusuke/yusuke_jump_landing_14frames.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add Yusuke V19 jump takeoff air fall and landing atlas'
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
