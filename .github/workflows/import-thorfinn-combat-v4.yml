name: Import user-authored Thorfinn combat sheets
on:
  push:
    branches: ["feature/thorfinn-authored-combat-v4"]
    paths: [".github/workflows/import-thorfinn-combat-v4.yml"]
permissions:
  contents: write
jobs:
  build-verified-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependencies
        run: python -m pip install pillow==12.0.0 numpy opencv-python-headless
      - name: Download the five exact sheets supplied by the user
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-all-errors 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3FsehSSM8aaRaK5HcNwjYb3e6/67e395cd-b4dc-4e9b-ba1a-b78de93e5ca6.jpg' -o 'characters/thorfinn/source-air-attack.jpg'
          echo 'a6a947384247740215eb1ceab4079715cd22f0bb626ddea7be6c3f447cb6a804  characters/thorfinn/source-air-attack.jpg' | sha256sum -c -
          curl -fLsS --retry 3 --retry-all-errors 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3FsehSSM8aaRaK5HcNwjYb3e6/69b93a40-5b2f-43cd-8fa0-1c6e65052f71.jpg' -o 'characters/thorfinn/source-hurt.jpg'
          echo '16d7d35844dfba8a0c72fe19e2198749caf653beb554157d4c939dd60041fb91  characters/thorfinn/source-hurt.jpg' | sha256sum -c -
          curl -fLsS --retry 3 --retry-all-errors 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3FsehSSM8aaRaK5HcNwjYb3e6/f6b6a57e-aea4-4bdd-9a38-32664babd95f.jpg' -o 'characters/thorfinn/source-air-combo.jpg'
          echo '99514bd50c33fb26a06b7fd79aae5fc4f296807f347cd42748e031e89d052fc9  characters/thorfinn/source-air-combo.jpg' | sha256sum -c -
          curl -fLsS --retry 3 --retry-all-errors 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3FsehSSM8aaRaK5HcNwjYb3e6/ff786758-1d9e-46e0-9197-8e211b3881e2.jpg' -o 'characters/thorfinn/source-ground-combo.jpg'
          echo '0e8deef7e0109f8c3d1dc86b4a655c20ffc11f175f700201d3baefb60def5e99  characters/thorfinn/source-ground-combo.jpg' | sha256sum -c -
          curl -fLsS --retry 3 --retry-all-errors 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3FsehSSM8aaRaK5HcNwjYb3e6/64a9e7bf-5c28-41d5-99ec-66abf484f35e.jpg' -o 'characters/thorfinn/source-blade-barrage.jpg'
          echo '2fe7873fb3d8f1846faa6dda23994e703e1f05bfacddf9bce1443601f203aefb  characters/thorfinn/source-blade-barrage.jpg' | sha256sum -c -
      - name: Extract 36 source-authored fighting frames with true transparency
        run: python tools/pack-thorfinn-combat-v4.py
      - name: Inspect every output cel and transparency
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          image=Image.open("characters/thorfinn/thorfinn-combat-v4.webp").convert("RGBA")
          assert image.size==(3072,1600),image.size
          for index in range(36):
              x=(index%8)*384;y=(index//8)*320
              tile=image.crop((x,y,x+384,y+320))
              a=tile.getchannel("A")
              assert a.getbbox(),f"Empty combat frame {index}"
              assert tile.getpixel((0,0))[3]==0,f"Opaque border in {index}"
              assert sum(1 for alpha in a.getdata() if alpha>=245)>1000,f"Transparent body in {index}"
          print("PASS: 36 detailed nonempty transparent Thorfinn combat sprites")
          PY
      - name: Commit exact user sheets and runtime atlas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters/thorfinn/source-*.jpg characters/thorfinn/thorfinn-combat-v4.webp
          git rm .github/workflows/import-thorfinn-combat-v4.yml
          git commit -m "Import 36 user-authored Thorfinn combat and hurt poses"
          git push origin HEAD:feature/thorfinn-authored-combat-v4
