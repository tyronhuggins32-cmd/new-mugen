name: Import transparent Yusuke Triangle Launcher V31
on:
  push:
    paths:
      - '.github/workflows/import-yusuke-launcher-v31.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and integrity-check 12-frame launcher PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p characters/yusuke
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://at.adobe.com/DcjhUDtPJsapDfcv' \
            -o characters/yusuke/yusuke_triangle_launcher_12frames.png
          echo 'fc9d254538c3981313767a691287423867f12de5a2878a600deca21dd8cc4c1d  characters/yusuke/yusuke_triangle_launcher_12frames.png' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path('characters/yusuke/yusuke_triangle_launcher_12frames.png').read_bytes()
          assert b[:8]==bytes.fromhex('89504e470d0a1a0a'), 'Not PNG'
          assert struct.unpack('>II',b[16:24]) == (1024,768), 'Wrong 4 x 3 atlas dimensions'
          assert b[25] == 6, 'Expected true RGBA alpha'
          assert len(b)>500000, 'Unexpectedly tiny / degraded texture'
          print('Verified original full-color 12-frame transparent uppercut atlas')
          PY
      - name: Commit Yusuke launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters/yusuke/yusuke_triangle_launcher_12frames.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add 12-frame transparent Yusuke Triangle launcher sprite atlas'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
