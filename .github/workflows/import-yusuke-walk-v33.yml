name: Import Yusuke Walk V33 Artwork
on:
  push:
    paths:
      - .github/workflows/import-yusuke-walk-v33.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-walk-v33:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact authored transparent sprite sheet
        env:
          SPRITE_SOURCE: https://at.adobe.com/gjcGaFM8zfEyrakg
        run: |
          set -euo pipefail
          mkdir -p characters/yusuke
          curl --fail --location --silent --show-error --retry 2 --max-time 120 "$SPRITE_SOURCE" -o characters/yusuke/yusuke_walk_forward_v33_18frames.png
      - name: Verify PNG dimensions and RGBA format
        run: |
          python3 - <<'PY'
          import struct, pathlib
          p=pathlib.Path("characters/yusuke/yusuke_walk_forward_v33_18frames.png")
          raw=p.read_bytes()
          assert len(raw)>10000, "Sprite upload was empty or truncated"
          assert raw[:8]==b"\x89PNG\r\n\x1a\n", "Download was not a PNG"
          assert raw[12:16]==b"IHDR", "PNG image header missing"
          width,height,bit_depth,color_type=struct.unpack(">IIBB",raw[16:26])
          assert (width,height)==(1536,768), (width,height)
          assert color_type==6, "Expected transparent RGBA PNG"
          print(f"Verified Yusuke V33: {width}x{height}, RGBA, {len(raw)} bytes")
          PY
      - name: Commit exact atlas to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters/yusuke/yusuke_walk_forward_v33_18frames.png
          if git diff --staged --quiet; then
            echo "Exact sprite file already present."
            exit 0
          fi
          git commit -m "Add Yusuke V33 transparent 18-frame walking atlas"
          git push origin HEAD:main
