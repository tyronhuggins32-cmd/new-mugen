name: Finish Yusuke palette and silhouette polish
on:
  push:
    paths:
      - ".github/workflows/install-yusuke-polished-v7.yml"
permissions:
  contents: write
jobs:
  produce-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic image dependencies
        run: python3 -m pip install --quiet --break-system-packages "pillow>=10,<13" "numpy>=1.24,<3"
      - name: Verify original master sprites
        run: |
          echo "a361f1196c3827ff2ba81271df67d454e58bdfa1990e57829d8230b6728475bd  characters/yusuke/yusuke-premium-combat.png" | sha256sum -c
          echo "912feb7bcf7af6908ea0d61e5b617e9b18e0485492dc983fc0775f0ade15da93  characters/yusuke/yusuke-premium-movement.png" | sha256sum -c
      - name: Build cleaner matched-palette sprites
        run: python3 tools/polish-yusuke-v7.py
      - name: Validate bounds transparency and color adjustment
        run: |
          python3 - <<'PY'
          from PIL import Image
          import numpy as np,json
          with open("characters/yusuke/premium-atlas.json") as f: data=json.load(f)
          for family in ("combat","movement"):
            name="characters/yusuke/yusuke-premium-"+family
            old=np.array(Image.open(name+".png").convert("RGBA"))
            new=np.array(Image.open(name+"-v7.png").convert("RGBA"))
            assert old.shape==new.shape==(1024,2048,4)
            assert np.max(np.abs(old[:,:,3].astype(int)-new[:,:,3].astype(int))) <= 7
            assert int(np.sum(new[:,:,3]>90))==int(np.sum(old[:,:,3]>90))
            assert int(np.count_nonzero(np.any(old[:,:,:3]!=new[:,:,:3],axis=2)&(new[:,:,3]>90)))>40000
            for f in data[family]["frames"]:
              section=new[f["y"]:f["y"]+f["h"],f["x"]:f["x"]+f["w"],3]
              assert section.size and section.max()>200
            print(family,"sprite color improved, silhouette and 8 source frame bounds preserved")
          PY
      - name: Commit polished source artwork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters/yusuke/yusuke-premium-*-v7.png
          if ! git diff --cached --quiet; then
            git commit -m "Add color-matched high-detail Yusuke V7 sprite families"
            git pull --rebase origin main
            git push
          fi
