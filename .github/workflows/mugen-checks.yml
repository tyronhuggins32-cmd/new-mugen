name: Mugen regression checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Combat engine regression tests
        run: node tests/engine.cjs
      - name: Three-Square combo and Triangle energy threshold
        run: node tests/triangle-combo.cjs
      - name: Spirit Shotgun anime-reference VFX and damage safety
        run: node tests/shotgun-v4.cjs
      - name: Yusuke sprite expansion checks
        run: node tests/yusuke-sprites.cjs
      - name: Yusuke skin and costume palette consistency
        run: node tests/yusuke-palette.cjs
      - name: Yusuke 60 Hz virtual motion checks
        run: node tests/yusuke-motion.cjs
      - name: Fluid 60 Hz combat and adaptive camera checks
        run: node tests/fluid-v3.cjs
      - name: Visual effects and sprite interpolation checks
        run: node tests/visuals.cjs
      - name: DualSense controller checks
        run: node tests/gamepad.cjs
      - name: Neon arcade home and character select checks
        run: node tests/neon-ui.cjs
