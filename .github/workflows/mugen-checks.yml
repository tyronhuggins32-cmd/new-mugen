name: Mugen regression checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Combat engine regression tests
        run: node tests/engine.cjs
      - name: Real punch contact, grounded launchers and no-bubble V40
        run: node tests/melee-contact-v40.cjs
      - name: Three-Square combo and Triangle energy threshold
        run: node tests/triangle-combo.cjs
      - name: Spirit Shotgun anime-reference VFX and damage safety
        run: node tests/shotgun-v4.cjs
      - name: Premium 16-frame fighter and extended rooftop checks
        run: node tests/premium-v6.cjs
      - name: Directional footwork, aerial follow-ups and 32 new fighter cels
        run: node tests/yusuke-directional-v8.cjs
      - name: Square combo expanded pose timeline
        run: node tests/yusuke-square-v10.cjs
      - name: Doubled Square sprites and seamless 60Hz handoffs
        run: node tests/yusuke-square-v12.cjs
      - name: Unbound cinematic reference moves, chase and aerial combat
        run: node tests/yusuke-reference-v13.cjs
      - name: Unbound rapid barrage and ranged Spirit Wave visual attack tests
        run: node tests/yusuke-reference-v14.cjs
      - name: Small original combat sound cues and sound-off safety
        run: node tests/combat-sfx-v8.cjs
      - name: Cinematic attack effects and sprite-safe cleanup
        run: node tests/cinematic-fx-v6.cjs
      - name: Yusuke sprite expansion checks
        run: node tests/yusuke-sprites.cjs
      - name: User's exact 16-pose Yusuke sprite reference and single-body rendering
        run: node tests/yusuke-exact-v15.cjs
      - name: New Yusuke transparent 8-frame walk and 8-frame idle integration
        run: node tests/yusuke-walk-idle-v16.cjs
      - name: All 48 Yusuke V17 movement frames and transparency
        run: node tests/yusuke-movement-v17.cjs
      - name: Yusuke V24 eighteen-frame dash and independent L3 run
        run: node tests/yusuke-dash-v24.cjs
      - name: Yusuke V22 24-frame walk interpolation and foot distance
        run: node tests/yusuke-walk-polish-v22.cjs
      - name: New Yusuke crouch and low walk sprites V18
        run: node tests/yusuke-crouch-v18.cjs
      - name: Fourteen-frame Yusuke jump ascent and landing V19
        run: node tests/yusuke-jump-v19.cjs
      - name: Eight-frame Yusuke high guard, blocked impact and recovery V23
        run: node tests/yusuke-guard-v23.cjs
      - name: Eight-frame Yusuke backward quick-step and forward R1 dash safety V24
        run: node tests/yusuke-dodge-v24.cjs
      - name: New 18-frame Yusuke Square jab, cross and body hook V25
        run: node tests/yusuke-light-combo-v25.cjs
      - name: New 16-frame Yusuke heavy combo on Triangle V26
        run: node tests/yusuke-heavy-combo-v26.cjs
      - name: Evolved Spirit Punch on Triangle and R2 plus Square V30
        run: node tests/yusuke-spirit-punch-v30.cjs
      - name: Spirit Punch combat energy, hitbox, knockout and input buffer V30
        run: node tests/yusuke-spirit-punch-combat-v30.cjs
      - name: Spirit Punch airborne knockback, directional flight, and guarded recovery V32
        run: node tests/yusuke-spirit-punch-launch-v32.cjs
      - name: Twelve-frame Yusuke fourth-Square Launcher Uppercut V28
        run: node tests/yusuke-uppercut-v28.cjs
      - name: Yusuke V32 thirty-frame rebuilt Square combo, no scaled-down finisher
        run: node tests/yusuke-square-combo-v32.cjs
      - name: Yusuke V34 complete 30-frame master Square combo and full-size recovery
        run: node tests/yusuke-square-combo-v34.cjs
      - name: Yusuke V35 rebuilt 30-frame Square combo, per-pixel alpha and size consistency
        run: node tests/yusuke-square-combo-v35.cjs
      - name: V36 reviewed Square body sprites, transparent 30-frame atlas, consistent uppercut recovery
        run: node tests/yusuke-square-combo-v36.cjs
      - name: V37 cinematic hit, stagger, flight, knockdown and 5-move pacing
        run: node tests/yusuke-reactions-v37.cjs
      - name: Twelve-frame Triangle Rising Launcher with preserved R2 Square Spirit Punch V31
        run: node tests/yusuke-triangle-launcher-v31.cjs
      - name: Recorded Yusuke V27 palette, body scale and close-combat collision fixes
        run: node tests/yusuke-video-bugs-v27.cjs
      - name: Yusuke V28 consistent sprite proportions, foot pivots and phase-locked locomotion
        run: node tests/yusuke-animation-v28.cjs
      - name: Yusuke V29 source pixel halo and palette cleanup
        run: node tests/yusuke-art-v29.cjs
      - name: Yusuke V30 exact canonical palette and Square finisher consistency
        run: node tests/yusuke-palette-v30.cjs
      - name: Yusuke V36 seamless sprite proportions and fixed palette
        run: node tests/yusuke-seamless-v36.cjs
      - name: White alpha-edge and enclosed white-gap cleanup regression
        run: node tests/yusuke-alpha-v9.cjs
      - name: Yusuke skin and costume palette consistency
        run: node tests/yusuke-palette.cjs
      - name: Yusuke V11 hair, uniform, and giant-sprite bounds
        run: node tests/yusuke-appearance-v11.cjs
      - name: Yusuke 40 FPS animation and reaction checks
        run: node tests/yusuke-motion.cjs
      - name: Fluid 60 Hz combat and adaptive camera checks
        run: node tests/fluid-v3.cjs
      - name: Cinematic Spirit Gun, punch assist, swept collision and spacing
        run: node tests/cinematic-v5.cjs
      - name: V8 aerial crossing, accurate strike boxes and authored VFX
        run: node tests/air-and-vfx-v8.cjs
      - name: Visual effects and sprite interpolation checks
        run: node tests/visuals.cjs
      - name: Thorfinn optional sprite import and damage states
        run: node tests/thorfinn-extra-pack.cjs
      - name: Thorfinn recorded-video visual and controller regressions
        run: node tests/thorfinn-video-overhaul.cjs
      - name: DualSense controller checks
        run: node tests/gamepad.cjs
      - name: Neon arcade home and character select checks
        run: node tests/neon-ui.cjs
