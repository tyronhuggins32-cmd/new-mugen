name: Install unified Yusuke combat sprites
on:
  push:
    paths:
      - ".github/workflows/install-yusuke-consistent.yml"
permissions:
  contents: write
jobs:
  install-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified pixel-art atlas
        env:
          SOURCE_URL: "https://at.adobe.com/7ts6vVOQAGl4ZrDu"
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --silent --show-error --output characters/yusuke/yusuke-combat-expansion.png "$SOURCE_URL"
          echo "8016f8bad1ef770d8c2ff257b7f1e5020acd392d0b1ddf55bf7c110d54d7e65f  characters/yusuke/yusuke-combat-expansion.png" | sha256sum --check
          python3 - <<'PY'
          import struct
          p="characters/yusuke/yusuke-combat-expansion.png"
          with open(p, "rb") as f: header=f.read(24)
          assert header[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II", header[16:24]) == (1536, 768)
          assert header[25-1] == 6 if len(header)>24 else True
          print("Verified sprite dimensions and PNG header")
          PY
      - name: Commit normalized atlas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add characters/yusuke/yusuke-combat-expansion.png
          if ! git diff --cached --quiet; then
            git commit -m "Replace Yusuke expansion with consistent-scale palette-matched sprites"
            git push
          fi
